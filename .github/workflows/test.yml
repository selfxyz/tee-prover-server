name: Test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on:
      - 'self-hosted'
      - 'selfxyz-org'
      - 'c4d-highmem-8'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88

      # Node is required by the cargo tests, not only by the Node suite below:
      # the brainpool ECDSA pre-check delegates to a Node/OpenSSL sidecar
      # (no Rust crate covers those curves), and its fixture tests spawn it for
      # real. Without Node the spawn fails, which correctly degrades to
      # `Skipped` -- so those tests would go red asserting `Valid`, which is the
      # loud failure we want rather than a silent one.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --bin tee-server

      - name: Build
        run: cargo build --bin tee-server

      # The sidecar's own suite: 30 tests, including a known-good OpenSSL
      # vector for each of the eight (curve, hash) pairings the brainpool
      # circuits use. Nothing else runs these -- `cargo test` exercises the
      # sidecar only through the pairings that have Rust-side vectors.
      #
      # Name the file explicitly. `node --test brainpool-verifier/` resolves
      # the directory as a module and fails with MODULE_NOT_FOUND rather than
      # scanning it.
      - name: Run sidecar tests
        run: node --test brainpool-verifier/verify.test.mjs
