[package]
name = "tee-server"
version = "0.1.0"
edition = "2021"

[dependencies]
jsonrpsee = {version = "0.24.7", features = ["server", "macros", "client-core"]}
tokio = {version="1.37.0", features = ["fs", "process"]}
uuid = {version = "1.12.0", features = ["v4", "serde"]}
serde = "1.0.217"
serde_json = "1.0.135"
aes-gcm = "0.10"
sqlx = {version="0.8.3", features=["runtime-tokio-rustls", "postgres", "uuid", "chrono"]}
clap = { version = "4.3", features = ["derive"] }

# attestation 
hyper = { version = "0.14", features = ["client", "tcp"] }
hyperlocal = "0.8"
base64 = "0.21"
google-cloud-secretmanager-v1 = "0.4.4"

serde_bytes = "0.11.15"
p256 = {version = "0.13.2", features = ["ecdh"]}
rand_core = "0.6.4"
serde_plain = "1.0.2"
lru = "0.13.0"
futures = "0.3"
num-bigint = "0.4"
num-integer = "0.1"
sha1 = "0.10"
sha2 = "0.10"

# KYC (EdDSA over BabyJubJub)
light-poseidon = "0.4.0"
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
num-traits = "0.2"
# babyjubjub-rs's default "blake-hash" backend hits an unimplemented SIMD
# dispatch path in ppv-lite86 on this toolchain; its "aarch64" feature swaps
# in the portable FFI "blake" crate instead (a C implementation, not actually
# arch-restricted despite the feature's name), which has no such issue.
babyjubjub-rs = { version = "0.0.11", default-features = false, features = ["aarch64"] }
# babyjubjub-rs's `Fr` (poseidon_rs::Fr) Display renders as "Fr(0x...)", not
# plain decimal, so converting to/from the decimal strings the circuit input
# JSON uses goes through this crate's own to_hex/from_hex, its canonical
# serialization pair (the same one babyjubjub-rs uses internally).
ff_ce = "0.11.0"

[features]
register = []
dsc = []
disclose = []
cherrypick = []
